# Production Environment Configuration
# Database Configuration for Production (AWS RDS or production database)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration for Production
# ddl-auto=validate: Only validates schema, does NOT modify it (safe!)
# Use Flyway or Liquibase for production migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Production optimizations
server.compression.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
