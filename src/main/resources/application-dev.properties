# Development Environment Configuration
# Database Configuration for Local Development
# Port 5433: Docker PostgreSQL (avoid conflict with native Windows PostgreSQL on 5432)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/toursmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JWT Configuration for Development (INSECURE - for dev only!)
# Override with real secret in production
jwt.secret=${JWT_SECRET:dev_insecure_secret_key_minimum_32_characters_long_12345}

# CORS Configuration for Development
# Comma-separated list of allowed origins
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JPA/Hibernate Configuration for Development
# ddl-auto=update: Auto-creates/updates tables from @Entity classes (convenient for dev)
spring.jpa.hibernate.ddl-auto=update
# show-sql: Log all SQL queries (helpful for learning and debugging)
spring.jpa.show-sql=true
# format_sql: Pretty-print SQL in logs
spring.jpa.properties.hibernate.format_sql=true
