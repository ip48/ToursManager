# Active Profile (dev, prod)
# Set via environment variable: SPRING_PROFILES_ACTIVE
# Default: dev (for local development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common Configuration (applies to all profiles)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# JWT Configuration
# Secret key should be at least 256 bits (32 characters) for HS256
# IMPORTANT: In production, MUST set JWT_SECRET environment variable
# Fallback is only for local development (never use in production!)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Default: 86400000 ms = 24 hours

# Profile-specific settings are in:
# - application-dev.properties (development)
# - application-prod.properties (production)